    "ovlfile04_func_80104EB8",   # seeded gap symbol (0x5C38 bytes, trailing to the section's declared end) fails with "Unhandled instruction: INVALID" -- genuine non-code bytes, i.e. trailing data at the end of the file, same pattern as the .ovl1 tail region found earlier this session
    "ovlfile04_func_800E4AEC",   # tail-calls to 0x800E49D8, which splat's own disassembly explicitly marks as "alabel func_800E49D8" (embedded data, not code) inside ovlfile04_func_800E49B8's body. N64Recomp auto-synthesizes a placeholder function there instead of raising a normal catchable error, which then fails on the data bytes further in (surfaced as "Error recompiling static_6_80104EB8" -- an internal name, not addressable via this stub list, hence stubbing the caller instead).
    "ovlfile04_func_800E48E4",   # splat's own original data has this (size 0x150, ending 0x800E4A34) genuinely overlapping ovlfile04_func_800E49B8 (0x800E49B8-0x800E4B30 before our splits) -- an ambiguous/imperfect splat boundary call in this specific spot. Its own tail call to 0x800E4A34 is a second, independent path into the same problematic embedded-data region as the stub above.
