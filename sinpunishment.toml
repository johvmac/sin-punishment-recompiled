# Config file for Sin & Punishment (Japan) Recompilation.
# Based on the N64Recomp config format (see BanjoRecomp's banjo.us.rev0.toml and
# N64Recomp/src/config.cpp). Paths are relative to the location of this config file.

[input]
entrypoint = 0x80025C00
# Paths are relative to the location of this config file.
output_func_path = "RecompiledFuncs"
# relocatable_sections_path = "overlays.sinpunishment.txt"  # enable once overlays are mapped (Phase 1)
rom_file_path = "rom/sinpunishment.z64"
# NOTE: generated in Phase 1 via Ghidra RE. Until then, N64Recomp cannot run.
symbols_file_path = "symbols/sinpunishment.syms.toml"
bss_section_suffix = "_bss"

[patches]
ignored = [
    # (empty) - no symbol ignored; validated in Phase 1.
]

stubs = [
    # Functions containing instructions N64Recomp cannot compile (cache ops, cop0 regs != Status, TLB ops).
    # All are libultra boot functions that N64ModernRuntime provides (mapped in Phase 2).
    "boot_func_80042F50",   # osWritebackDCache
    "boot_func_80043000",   # osInvalICache
    "boot_func_80043080",   # osWritebackIcache
    "boot_func_80043100",   # osInvalDCache
    "boot_func_800460F0",   # reads COP0 Cause
    "boot_func_80046100",   # reads COP0 Count (osGetTime)
    "boot_func_80046120",   # writes COP0 Compare (osSetTimer)
    "boot_func_80046150",   # writes COP0 WatchLo
    "boot_func_80047C60",   # __osProbeTLB (tlbp)
    "boot_func_80047D20",   # osMapTLB (tlbwi)
    "boot_func_80047D80",   # osUnmapTLB (tlbwi)
]

# (No instruction patches needed: N64Recomp cgenerator skips writes to $zero.)
