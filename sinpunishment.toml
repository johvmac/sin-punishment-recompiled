    # The game runs its own libultra-like SI manager: thread 6 (boot_func_8004EAD0)
    # receives controller commands on queue 0x800A5A4C via boot_func_8004EA68 and
    # dispatches them to PIF executors (boot_func_8004B610/B800) that call
    # boot_func_80046FE0 (__osSiRawStartDma) -> writes 0xA4800000-0x18 -> SIGBUS.
    #
    # The runtime reimplemented osCont* path (osContStartReadData_recomp etc.)
    # handles real input, so the game's own SI stack is neutralized entirely.
    # Stubs are post-processed (scripts/patch_si_stubs.py) to set ctx->r2 = 0 so
    # callers see "success" (controller present, no pak) instead of garbage.
    # 2026-08-15: boot_func_8004EA68 / boot_func_8004EAD0 UN-STUBBED. The
    # dispatch loop itself touches no hardware (audited 2026-08-14: only
    # osCreateMesgQueue/osSendMesg/osRecvMesg/osSetIntMask + LOOKUP_FUNC), and
    # stubbing it is what severed the only path that ever reaches the
    # controller-poll table at 0x80061F40. Two earlier un-stub attempts
    # regressed to a black screen; live gdb showed why, and the cause was
    # upstream of both: __osSiRawStartDma (below) is stubbed, so the
    # SI-DMA-complete interrupt never fires and boot_func_8003D5B0's
    # osRecvMesg blocks forever. That is now handled by scripts/patch_si_stubs.py
    # injecting recomp_trigger_si_event() into the __osSiRawStartDma stub.
    # "boot_func_8004EA68",   # SI command sender (osSendMesg 0x800A5A4C + block on reply)
    # "boot_func_8004EAD0",   # SI manager thread entry (dispatch loop)
    "boot_func_8004B800",   # PIF command executor (would block on SI-DMA completion)
    "boot_func_8004B610",   # PIF command executor (alternate path)
    "boot_func_80046FE0",   # __osSiRawStartDma (raw SI reg writes: crash site)
]

# Hook the game's logical code-file loader (boot_func_8003A1D0): after it DMAs
# an overlay's code image (jal 0x8003A5F0 at 0x8003A270) it returns through
# 0x8003A278, where we mirror the load into the runtime's func_map so
# get_function() can resolve the overlay's functions. Stack slots at the hook
# point (set earlier by the loader, confirmed by reading boot_func_8003A1D0's
# own body): [0x1C]=rom, [0x20]=next-file rom (exclusive bound -> size =
# [0x20]-[0x1C]), [0x24]=ram destination. All code overlays share 0x800E4780.
#
# This was previously left disabled with nothing wired up to replace it:
# `load_overlays()` (librecomp/src/overlays.cpp) is only ever called once at
# startup, for the initial 1MB from the entrypoint (recomp.cpp:499). None of
# the 27 ovlfileNN code overlays that share the 0x800E4780 window ever got
# mirrored into func_map, so any LOOKUP_FUNC call landing in that window
# failed with "Failed to find function at 0x...", which get_function()
# treats as fatal (calls std::exit()). Confirmed live via debug prints: this
# is exactly what killed boot once thread 3 (post scheduler-setup) started
# calling into a just-loaded overlay.
# boot_func_80026A54(queue_index) walks a linked list of deferred callbacks
# (5 head pointers at 0x80068A9C[queue_index*8]; each node has a countdown
# byte at +0, a function pointer at +4, a `next` pointer at +0xC). Confirmed
# via a live gdb watchpoint that one node's `next` field gets legitimately
# overwritten by a real, unmodified PI DMA -- boot_func_800263CC's own
# per-tick file-loading loop (thread 3's main loop, in boot_func_80025E44)
# bursts through up to ~23 files in a single call with no interleaved queue
# processing, and one of those files' destination overlaps a still-pending
# node's memory. This is original ROM behavior, not something introduced by
# any other patch here; nothing in this repo has been changed to trigger it.
# It was simply unreachable before the boot-deadlock and overlay-registration
# fixes above got this far for the first time. Whether real hardware avoids
# this via a load-ordering detail this reconstruction is still missing, or
# recovers from it some other way, isn't established -- see
# docs/boot-debugging-2026-08-13.md for the full trace.
#
# Rather than guess at the real fix, make the list walk defensive: treat a
# `next` pointer outside valid N64 RAM (the same 0x80000000-0x80800000 bound
# scripts/auto_stub_pass.py already uses for branch-target validation) as an
# end-of-list sentinel instead of dereferencing it. Hooked at the loop-back
# check (L_80026AD8), which runs every time `next` has just been read,
# before either continuing the loop or falling through to the existing,
# unmodified return path -- so a sanitized `next` of 0 takes that same
# correct return path with no new control flow needed.
[[patches.hook]]
func = "boot_func_80026A54"
before_vram = 0x80026AD8
text = "if ((unsigned int)ctx->r16 != 0 && ((unsigned int)ctx->r16 < 0x80000000u || (unsigned int)ctx->r16 >= 0x80800000u)) { ctx->r16 = 0; }"

# Same class of bug as boot_func_80026A54 above, and confirmed the same way
# (a live gdb inspection at the actual crash): boot_func_800395C8(obj) reads
# a count (obj+0x112), a loop-continuation value $s1 (obj+0x118), and a data
# pointer $s2 (obj+0x114) from a per-object struct, then loops
# unconditionally dereferencing $s2 while $s1 != 0. At the crash, the count
# field held a plausible small value (0x3F) but $s2/$s1 held clearly
# non-N64-RAM values (0x2c15e05f / 0x2d61d07f) -- the object's count was
# populated but its data pointers weren't yet, the same
# populated-metadata-before-data-pointers shape as the fix above, and
# consistent with the confirmed root cause noted further down (ultramodern's
# synchronous PI DMA vs real hardware's async model -- see
# docs/boot-debugging-2026-08-13.md).
#
# $s2 is read once and never changes across loop iterations, so validating
# it once, right after both reads (before the unconditional jump into the
# loop), is enough: if invalid, zero $s1 too so the loop's own real
# continuation check (`bne $s1, $zero, ...`) naturally treats it as
# nothing-to-do, without dereferencing anything.
[[patches.hook]]
func = "boot_func_800395C8"
before_vram = 0x80039600
text = "if ((unsigned int)ctx->r18 < 0x80000000u || (unsigned int)ctx->r18 >= 0x80800000u) { ctx->r17 = 0; }"

# Third instance of the same PI-DMA-timing-gap class (see
# docs/boot-debugging-2026-08-13.md), confirmed the same way via live gdb
# inspection at the actual crash. boot_func_80030448(list_struct) reads a
# count $s1 = *(list_struct+4) and an array base $s0 = *(list_struct+0) +
# $s1*4 (i.e. one-past-the-end), then walks backward from $s0 in a loop
# gated by `$s1 != 0`, decrementing $s0 by 4 and dereferencing it each
# iteration. At the crash, $s1 held 0x1d98d01f -- not a plausible element
# count for anything in this game (~500 million) -- so the walk immediately
# underflows past the array's real bounds into unmapped memory. Same
# populated-metadata-before-data shape as the two fixes above, just a count
# instead of a pointer this time.
#
# Sanitize $s1 right after both reads, before the unconditional jump into
# the loop: if it's above a generously large but still sane bound (0x10000
# -- far beyond any real array size in this game), treat it as 0 so the
# loop's own real continuation check (`bne $s1, $zero, ...`) naturally
# treats it as nothing-to-do.
[[patches.hook]]
func = "boot_func_80030448"
before_vram = 0x80030468
text = "if ((unsigned int)ctx->r17 > 0x10000u) { ctx->r17 = 0; }"

# Fourth instance, structurally identical to boot_func_80030448 immediately
# above (same list_struct argument shape: $s0 = *(a0+0), $s1 = *(a0+4)),
# just walking the array forward instead of backward. Confirmed via gdb the
# same way: $s1 held 0x217f1bb2 at the crash, not a plausible count. Same
# fix, same reasoning -- see docs/boot-debugging-2026-08-13.md.
[[patches.hook]]
func = "boot_func_800303D4"
before_vram = 0x800303EC
text = "if ((unsigned int)ctx->r17 > 0x10000u) { ctx->r17 = 0; }"

# A third call-free spin-wait, embedded inside boot_func_80025E44 (thread
# 3's own per-tick loop) rather than being a whole standalone function --
# which is why the earlier codebase-wide scan for "whole function is a
# spin" (used to find the first two, boot_func_80025CA4 and
# boot_func_8004D7B0) didn't catch it. `L_80025FB0: while
# (MEM_BU($8007,-0x756B) == 0);` -- waits for the currently-loaded
# overlay's own per-tick dispatch (called earlier in the same loop, via
# boot_func_800263CC's LOOKUP_FUNC jump table) to write a nonzero value
# here. Normally resolves synchronously, same-thread, same call, so it
# never actually blocks -- confirmed live via gdb across multiple runs:
# after the four crash fixes above changed downstream execution enough,
# thread 3 now gets stuck here at 100% CPU with every other thread idle,
# the exact same "runtime never pumps/reschedules because nothing yields"
# failure as the first two fixes. Same fix, same reasoning -- see
# docs/boot-debugging-2026-08-13.md.
[[patches.hook]]
func = "boot_func_80025E44"
before_vram = 0x80025FB0
text = "extern void yield_self_1ms(unsigned char*); yield_self_1ms(rdram);"

[[patches.hook]]
func = "boot_func_8003A1D0"
before_vram = 0x8003A278
text = "extern void load_overlays(unsigned int, int, unsigned int); load_overlays((unsigned int)MEM_W(ctx->r29, 0x1C), (int)MEM_W(ctx->r29, 0x24), (unsigned int)(MEM_W(ctx->r29, 0x20) - MEM_W(ctx->r29, 0x1C)));"

# Second, independent overlay-loading path used e.g. by boot_func_800263CC ->
# boot_func_8003A290, which funnels through the same raw PI-DMA primitive as
# the "sync-PI-DMA helper" from the requeue_pi comment in main.cpp:
# boot_func_8003A514(rom, ram_dest, size). Its original o32 args are exactly
# load_overlays()'s signature. Hooking at its entry, before its body moves
# them out of a0-a2, mirrors every DMA'd region unconditionally.
# load_overlays() only touches its own ROM-range-indexed section table (a
# binary search bounded by [rom, rom+size)), so calling it for a DMA that
# isn't a (currently-known) code overlay -- textures, audio, or the
# Yay0-compressed overlays this path also loads, which aren't symbolized yet
# -- just finds no matching section and no-ops. Safe to call unconditionally.
[[patches.hook]]
func = "boot_func_8003A514"
before_vram = 0x8003A514
text = "extern void load_overlays(unsigned int, int, unsigned int); load_overlays((unsigned int)ctx->r4, (int)ctx->r5, (unsigned int)ctx->r6);"

# boot_func_80025CA4 is the game's lowest-priority "idle" thread: after
# spawning and starting the higher-priority thread that does the real
# scheduler setup (boot_func_80025E44, N64 thread id 3), it demotes its own
# priority to 0 and spins on `lw $v0, 0x57B0($at); beq $v0, $zero, spin`,
# waiting for another thread to write a function pointer into D_800657B0.
#
# On real hardware this works because a VI/PI/timer hardware interrupt can
# preempt the spin at any point and asynchronously deliver the write. Ultramodern
# has no equivalent async preemption: ultramodern::dequeue_external_messages()
# (which drains queued VI/PI/SI/timer completions into their target message
# queues) and ultramodern::check_running_queue() (which swaps to a
# higher-priority ready thread) are only invoked from within a game thread's
# own OS calls (osSendMesg/osRecvMesg/osSetThreadPri/etc). Since this loop is a
# faithful, call-free translation of the original 3 MIPS instructions, nothing
# ever pumps those queues once it starts spinning: thread 3 (and everything it
# spawned) is left parked forever waiting on a message that can never be
# delivered, and D_800657B0 is never written. Confirmed live via gdb: message
# queue creation and osViSetEvent registration all succeed normally, then all
# message/thread activity stops dead the instant this thread enters the loop.
#
# Fix: make each spin iteration call ultramodern::yield_self_1ms(), which
# already exists for exactly this purpose (wait_for_external_message_timed +
# check_running_queue). This drains the pending message(s), wakes/re-queues
# whichever thread was waiting on them, and -- since that thread now has
# higher priority than this one -- immediately swaps execution to it. No
# runtime/scheduler changes needed; this only uses already-existing,
# already-used-elsewhere ultramodern primitives from the one call site that
# was missing them.
[[patches.hook]]
func = "boot_func_80025CA4"
before_vram = 0x80025D30
text = "extern void yield_self_1ms(unsigned char*); yield_self_1ms(rdram);"

# Same call-free spin-wait pattern as above, one level deeper: boot_func_8004D7B0
# is the entire function body -- `while (*(int*)0x8008546C != 0);` -- called
# synchronously from thread 3's own scheduler-setup chain (boot_func_80025D50).
# A codebase-wide scan for this exact shape (whole function is a single
# backward-branching poll of a MEM_* read, no calls) found only these two
# occurrences; this is the second and, as far as that scan shows, last one.
[[patches.hook]]
func = "boot_func_8004D7B0"
before_vram = 0x8004D7B0
text = "extern void yield_self_1ms(unsigned char*); yield_self_1ms(rdram);"

# Fifth instance of the "populated metadata / unpopulated data pointer"
# struct-validation bug class (see the four above). This one only became
# reachable after fixing the ovlfile22_func_800E4780/ovlfile01_func_800E4780
# symbol-boundary issues (symbols/sinpunishment.syms.toml) that were
# permanently stalling this thread earlier -- boot_func_8004E640 used to
# block forever in osRecvMesg before ever reaching this code. Now it does,
# and crashes: at L_8004E7B4 (the per-client completion-notify send at the
# end of the dispatch loop, right before looping back), $a1 = the per-client
# struct pointer read from the stack, and $a0 (the target OSMesgQueue*) is
# loaded from client_struct+0x50. Confirmed live via gdb: that field holds
# 0xbcab4f09 at the crash (do_send() dereferences it, SIGSEGV) -- not a
# plausible RDRAM address, same "count/metadata populated before the
# pointer field is" timing gap as the other four instances, all downstream
# of ultramodern's synchronous (vs. real hardware's async) PI DMA. Fixed by
# skipping the send entirely when the loaded pointer is invalid -- jumping
# straight to L_8004E64C (the loop's own top-of-loop label, which is what
# this send's fallthrough (`after_16`) unconditionally does next anyway, so
# this is behaviorally identical to "the send silently did nothing" on an
# invalid target, not a new control-flow path). See
# docs/boot-debugging-2026-08-13.md for the ovlfile01/22 fix and this
# crash's full gdb backtrace.
[[patches.hook]]
func = "boot_func_8004E640"
before_vram = 0x8004E7C0
text = "if ((unsigned int)ctx->r4 < 0x80000000u || (unsigned int)ctx->r4 >= 0x80800000u) { goto L_8004E64C; }"

# Sixth instance of the same bug class, but on a function pointer instead of
# a data pointer this time. boot_func_8004DD0C is a message-driven callback
# dispatcher: it blocks on osRecvMesg, and on message type 1 or 2 loads a
# registered callback function pointer from one of two globals
# (0x8008xxxx-0x50F4 for type 1, -0x50F0 for type 2) and calls it via
# LOOKUP_FUNC (get_function() + indirect call). Both sites already guard
# against the pointer being exactly zero ("not registered yet") but not
# against it being nonzero-but-garbage. Confirmed live via gdb (breaking on
# get_function()'s entry, conditioned on the known bad value seen in
# earlier non-gdb runs -- source-line and by-name breakpoints both failed
# to resolve for this translation unit/symbol, worked around with a raw
# address breakpoint computed from `nm`'s static offset plus the ASLR slide
# gdb reports for `main`, and by reading the address parameter directly out
# of $edi since it's read before the prologue spills it to its debug-visible
# stack slot): get_function(0x3DC7CA55) -- nowhere near valid N64 RAM
# (0x80000000-0x80800000), and not a value that looks like it started as a
# real pointer and got corrupted a little; consistent with an uninitialized
# stack/heap value read before whatever sets up this callback registration
# has run. Same root cause class as the other five (ultramodern's
# synchronous PI DMA vs. real hardware's async model creating a window
# where a slot is legitimately still unpopulated when something reads it).
# Fixed the same way at both call sites: validate the loaded pointer is in
# valid N64 RAM before calling LOOKUP_FUNC on it; if not, skip the call the
# same way the existing "== 0" check already does (both fall through to
# L_8004DD48, the loop's own top, to wait for the next message).
[[patches.hook]]
func = "boot_func_8004DD0C"
before_vram = 0x8004DDA0
text = "if ((unsigned int)ctx->r2 < 0x80000000u || (unsigned int)ctx->r2 >= 0x80800000u) { goto L_8004DD48; }"

[[patches.hook]]
func = "boot_func_8004DD0C"
before_vram = 0x8004DDC0
text = "if ((unsigned int)ctx->r2 < 0x80000000u || (unsigned int)ctx->r2 >= 0x80800000u) { goto L_8004DD48; }"

